<body>
<div class="wrap">
  <header>
    <a class="logo" id="homeLink" href="__HOME_URL__" title="返回首页" aria-label="返回首页">📁</a>
    <div>
      <h1>文件服务器</h1>
      <p class="sub">拖拽即可上传 · 支持多人同时使用</p>
    </div>
    <div class="path" id="curpath">/</div>
  </header>

  <section class="card">
    <h2>⬆️ 上传文件 <span class="badge" id="upbadge"></span></h2>
    <p class="hint">把文件拖到下面的方框里，或点击方框选择文件；支持一次选择多个文件。</p>
    <div id="drop">
      <div class="big">📥</div>
      <div class="t">拖拽文件到此处，或 <u>点击选择</u></div>
      <div class="s">上传目标：<code id="updir">/</code></div>
    </div>
    <input type="file" id="picker" multiple hidden>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2>📂 当前目录 <span class="badge gray" id="cnt"></span></h2>
    <p class="hint">下列文件来自服务器实时目录，点击即可下载或进入子目录。</p>
    <div id="files"><div class="empty">正在读取…</div></div>
    <div class="tools">
      <input class="search" id="filter" type="search" placeholder="🔍 过滤文件名…">
      <a class="btn primary" href="./">🔄 刷新</a>
      <a class="btn" href="../">⬆️ 上一级目录</a>
      <a class="btn" id="gotoUpload" href="#">📤 前往上传目录</a>
    </div>
    <div class="note info" id="tip" style="display:none"></div>
  </section>

  <footer>Powered by <b>miniserve</b> · 页面样式来自 web/home.html</footer>
</div>

<script>
/* ===== 由 start.bat 注入的配置 ===== */
var UPLOAD_PATH   = "__UPLOAD_PATH__";    // 允许上传的目录，如 /upload；空=任意位置
var ALLOW_DELETE  = "__ALLOW_DELETE__";   // 1=允许删除
var RM_PREFIX     = "__RM_PREFIX__";      // 允许删除的目录前缀，如 upload；空=全部
var ROUTE_PREFIX  = "__ROUTE_PREFIX__";   // 路由前缀，如 /files
var ARCHIVE_OK    = "__ARCHIVE_OK__";     // 1=子目录可用官方 ?download= 打包下载

var PATH = decodeURIComponent(location.pathname) || "/";
var REL  = PATH.replace(/^\/+/, "");     // 相对服务根的路径
var BASE = ROUTE_PREFIX ? ROUTE_PREFIX : "";
var HOME_URL = BASE ? BASE.replace(/\/+$/, "") + "/" : "/";

document.getElementById("curpath").textContent = "当前目录：" + PATH;
document.getElementById("homeLink").href = HOME_URL;

var TARGET = UPLOAD_PATH ? UPLOAD_PATH : PATH;
document.getElementById("updir").textContent = TARGET;
document.getElementById("upbadge").textContent = UPLOAD_PATH ? ("目标目录 " + UPLOAD_PATH) : "当前目录";
function dirUrl(p){ return p.charAt(p.length-1) === "/" ? p : p + "/"; }
document.getElementById("gotoUpload").href = BASE + dirUrl(UPLOAD_PATH || PATH);

if (UPLOAD_PATH && UPLOAD_PATH !== PATH){
  var tip = document.getElementById("tip");
  tip.style.display = "";
  tip.textContent = "ℹ️ 本服务只允许上传到 " + UPLOAD_PATH + " 目录，文件会直接存入该目录。";
}

/* ===== 上传 ===== */
var drop = document.getElementById("drop");
var picker = document.getElementById("picker");
var list = document.getElementById("list");

drop.addEventListener("click", function(){ picker.click(); });
picker.addEventListener("change", function(){ upload([...picker.files]); picker.value = ""; });
["dragenter","dragover"].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.add("over"); }); });
["dragleave","drop"].forEach(function(e){ drop.addEventListener(e, function(ev){ ev.preventDefault(); drop.classList.remove("over"); }); });
drop.addEventListener("drop", function(ev){ upload([...ev.dataTransfer.files]); });

function humanSize(n){
  if (n === null || n === undefined) return "";
  var u = ["B","KB","MB","GB","TB"], i = 0; n = Number(n);
  while (n >= 1024 && i < u.length-1){ n /= 1024; i++; }
  return (i ? n.toFixed(1) : n) + " " + u[i];
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function upload(files){
  if (!files.length) return;
  files.forEach(function(f){
    var item = document.createElement("div");
    item.className = "row";
    item.innerHTML = '<span class="ico">📄</span><div style="flex:1;min-width:0">' +
      '<div class="nm">' + escapeHtml(f.name) + '</div>' +
      '<div class="bar"><i></i></div><div class="state">上传中…</div></div>';
    list.prepend(item);
    var bar = item.querySelector(".bar > i");
    var st  = item.querySelector(".state");
    var fd = new FormData(); fd.append("file", f);
    fetch(BASE + "/upload?path=" + encodeURIComponent(TARGET), { method:"POST", body:fd })
      .then(function(res){
        if (res.status === 303 || res.ok){
          st.textContent = "✅ 上传成功"; st.className = "state ok"; bar.style.width = "100%";
        } else if (res.status === 403){
          st.textContent = "⛔ 该目录不允许上传（仅允许 " + (UPLOAD_PATH || "任意目录") + "）"; st.className = "state err";
        } else if (res.status === 401){
          st.textContent = "🔒 需要登录后才能上传"; st.className = "state err";
        } else {
          st.textContent = "⚠️ 上传失败 (HTTP " + res.status + ")"; st.className = "state err";
        }
      })
      .catch(function(err){ st.textContent = "⚠️ 上传失败：" + err.message; st.className = "state err"; });
  });
  setTimeout(loadFiles, 700);
}

/* ===== 删除 =====
   安全规则：
   1) 删除范围必须严格位于 RM_PREFIX 之内（不能等于它本身）；
   2) 上传目录本身、以及包含它的所有上级目录，永远不可删除
      （否则删掉 upload 后大家都无法上传了）。
*/
var UPLOAD_REL = UPLOAD_PATH ? UPLOAD_PATH.replace(/^\/+/, "").replace(/\/+$/, "") : "";

// 上传目录及其所有上级目录 -> 受保护
var PROTECTED = (function(){
  var set = {};
  if (!UPLOAD_REL) return set;
  var parts = UPLOAD_REL.split("/");
  for (var i = parts.length; i > 0; i--) set[parts.slice(0, i).join("/")] = true;
  return set;
})();

function isProtected(relPath){
  if (!relPath) return false;
  if (PROTECTED[relPath]) return true;
  // 上级目录（包含上传目录的目录）也不可删
  for (var k in PROTECTED) {
    if (k.indexOf(relPath + "/") === 0) return true;
  }
  return false;
}

function canDelete(relPath){
  if (ALLOW_DELETE !== "1") return false;
  if (!relPath) return false;
  if (isProtected(relPath)) return false;      // 上传目录及其上级
  if (!RM_PREFIX) return true;                // 未限定范围
  return relPath.indexOf(RM_PREFIX + "/") === 0;  // 必须严格位于范围之内
}
function del(relPath){
  if (!confirm("确定删除 " + relPath + " 吗？此操作不可恢复。")) return;
  fetch(BASE + "/rm?path=" + encodeURIComponent(relPath), { method:"POST" })
    .then(function(res){
      if (res.status === 303 || res.ok){ loadFiles(); }
      else if (res.status === 403) alert("⛔ 没有删除权限（仅允许删除 " + (RM_PREFIX || "任意位置") + "）");
      else if (res.status === 401) alert("🔒 需要登录后才能删除");
      else alert("⚠️ 删除失败 (HTTP " + res.status + ")");
    })
    .catch(function(err){ alert("⚠️ 删除失败：" + err.message); });
}

/* ===== 目录列表（只读 WebDAV PROPFIND） ===== */
function byLocalName(root, name){
  var out = [];
  (function walk(el){
    if (el.localName === name) out.push(el);
    for (var i = 0; i < el.children.length; i++) walk(el.children[i]);
  })(root);
  return out;
}

var ALL_ROWS = [];

async function loadFiles(){
  var box = document.getElementById("files");
  box.innerHTML = '<div class="empty">正在读取…</div>';
  var xml;
  try{
    var res = await fetch(PATH, { method:"PROPFIND", headers:{ "Depth":"1" } });
    if (!res.ok) throw new Error("HTTP " + res.status);
    xml = new DOMParser().parseFromString(await res.text(), "application/xml");
  }catch(err){
    box.innerHTML = '<div class="empty">⚠️ 读取目录失败（' + escapeHtml(err.message) +
      '）。若需显示文件列表，请在 config.txt 中设置 <code>ENABLE_WEBDAV=1</code> 并重启服务。</div>';
    return;
  }
  var resp = byLocalName(xml.documentElement, "response");
  var rows = [], selfPath = PATH.replace(/\/+$/,"") || "/";
  resp.forEach(function(r){
    var hrefEl = byLocalName(r, "href")[0];
    if (!hrefEl) return;
    var href = decodeURIComponent(hrefEl.textContent.trim());
    var isDir = byLocalName(r, "collection").length > 0 || href.endsWith("/");
    var sizeEl = byLocalName(r, "getcontentlength")[0];
    if (!isDir && !sizeEl) return;
    var clean = href.replace(/\/+$/,"") || "/";
    if (clean === selfPath) return;
    var name = clean.split("/").pop() || clean;
    var rel = clean.replace(/^\/+/, "");
    // 隐藏自动生成的首页文件，避免目录里出现一堆 index.html
    if (name === "index.html") return;
    var timeEl = byLocalName(r, "getlastmodified")[0], t = "";
    if (timeEl){ var d = new Date(timeEl.textContent.trim()); if (!isNaN(d)) t = d.toLocaleString("zh-CN", {hour12:false}); }
    rows.push({ href:href, name:name, isDir:isDir, rel:rel,
                size:sizeEl ? humanSize(sizeEl.textContent) : "", time:t });
  });
  if (!rows.length){
    ALL_ROWS = [];
    box.innerHTML = '<div class="empty">' + (document.getElementById("filter").value ? "（没有匹配的文件）" : "（空目录）") + '</div>';
    document.getElementById("cnt").textContent = "0 项";
    return;
  }
  rows.sort(function(a,b){ return (b.isDir - a.isDir) || a.name.localeCompare(b.name); });
  ALL_ROWS = rows;
  // 刷新后保持当前搜索条件（删除/上传后自动刷新时不会丢掉过滤）
  SHOWN = RENDER_LIMIT;
  renderRows(document.getElementById("filter").value);
}

// 大目录只渲染前 N 条，避免一次性创建上万 DOM 节点导致卡顿
var RENDER_LIMIT = 10;
var SHOWN = RENDER_LIMIT;

// 官方列表页地址：只有没有 index.html 的目录才走官方列表页。
// 根目录被 index.html 顶替了，所以那里改用官方的打包下载入口。
var OFFICIAL_LIST_URL = dirUrl(PATH);

function renderRows(filter){
  var box = document.getElementById("files");
  var rows = ALL_ROWS.filter(function(r){ return r.name.toLowerCase().indexOf(filter.toLowerCase()) >= 0; });
  var total = rows.length;
  document.getElementById("cnt").textContent = total + " 项";
  if (!total){ box.innerHTML = '<div class="empty">（没有匹配的文件）</div>'; return; }

  var visible = rows.slice(0, SHOWN);
  var html = visible.map(function(r){
    var delBtn = canDelete(r.rel)
      ? '<button class="del" onclick="del(\'' + escapeHtml(r.rel) + '\')">🗑 删除</button>' : '';
    var dlBtn = r.isDir
      ? (ARCHIVE_OK === "1"
          ? '<a class="dl" href="' + encodeURI(r.href) + '?download=zip" title="打包下载该目录 (zip)">⬇ zip</a>' +
            '<a class="dl" href="' + encodeURI(r.href) + '?download=tar.gz" title="打包下载该目录 (tar.gz)">⬇ tgz</a>'
          : '')
      : '<a class="dl" href="' + encodeURI(r.href) + '" download title="下载文件">⬇ 下载</a>';
    return '<div class="row">' +
      '<span class="ico">' + (r.isDir ? "📁" : "📄") + '</span>' +
      '<a class="nm" style="text-decoration:none;color:inherit" href="' + encodeURI(r.href) + '">' + escapeHtml(r.name) + '</a>' +
      '<span class="meta">' + (r.isDir ? "目录" : escapeHtml(r.size)) + (r.time ? " · " + escapeHtml(r.time) : "") + '</span>' +
      dlBtn + delBtn + '</div>';
  }).join("");

  if (total > SHOWN){
    html += '<div class="more">' +
            '<button class="btn" id="showMore">⬇ 显示更多（还有 ' + (total - SHOWN) + ' 项）</button>' +
            '<span class="hint-inline">共 ' + total + ' 项 · 用上方搜索框筛选可缩小范围</span>' +
            '</div>';
  }
  box.innerHTML = html;

  var more = document.getElementById("showMore");
  if (more) more.addEventListener("click", function(){
    SHOWN += RENDER_LIMIT;
    renderRows(document.getElementById("filter").value);
  });
}

document.getElementById("filter").addEventListener("input", function(ev){
  SHOWN = RENDER_LIMIT;
  renderRows(ev.target.value);
});
loadFiles();
</script>
</body>
</html>
